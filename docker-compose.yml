services:
  vitriol:
    build:
      context: .
    image: vitriol-web:latest
    # `container_name` and the host port binding are convenient for direct
    # `docker compose up` use. Coolify (and most other Docker PaaS) ignore
    # container_name and re-publish via their own reverse proxy — so both
    # are harmless to keep.
    container_name: vitriol
    restart: unless-stopped
    ports:
      - "3825:3825"
    volumes:
      - vitriol-data:/data
    # Coolify injects env vars directly; this `env_file` line is only
    # consulted if .env exists alongside the compose file. Missing .env
    # is fine — every var has a sensible default and the first-run /setup
    # wizard captures the super admin in the browser.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3825/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vitriol-data:
