{% extends "base.html" %}
{% block title %}Files — Vitriol{% endblock %}
{% block content %}
<section class="admin-page">
  <header class="admin-head">
    <h1 class="display">Files</h1>
    <p class="muted small" style="margin: 0;">
      Converted outputs still on the server. Retention is set by role on the
      <a href="/admin/server#retention">Server settings</a> page.
    </p>
  </header>

  <div class="users-toolbar">
    <input id="files-search" type="search" placeholder="Search by filename, format, or owner…" autocomplete="off" />
    <span id="files-count" class="muted small"></span>
  </div>

  <table class="users-table" id="files-table">
    <thead>
      <tr>
        <th><input type="checkbox" id="files-select-all" title="Select all" /></th>
        <th data-sort="dst_filename" class="sortable">Filename <span class="sort-ind"></span></th>
        <th data-sort="dst_ext" class="sortable">Type <span class="sort-ind"></span></th>
        <th data-sort="bytes_out" class="sortable">Size <span class="sort-ind"></span></th>
        <th data-sort="finished_at" class="sortable">Converted <span class="sort-ind"></span></th>
        <th data-sort="owner_username" class="sortable">Owner <span class="sort-ind"></span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="files-tbody"></tbody>
  </table>

  <div class="bulk-actions" style="margin-top: 16px;">
    <button id="files-download" class="btn btn-primary">Download Selected</button>
    <button id="files-replay" class="btn btn-secondary">Add Selected to Playlist</button>
    <span class="bulk-spacer"></span>
    <button id="files-delete" class="btn btn-danger">Delete Selected</button>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/files.js?v={{ v }}"></script>
{% endblock %}
